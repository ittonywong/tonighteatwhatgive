<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>
/* GitHub Pages project base — 改 repo 名必須改 REPO */
(function(){var REPO="tonighteatwhatgive";var p=location.pathname;var base="./";if(p==="/"+REPO||p.indexOf("/"+REPO+"/")===0){base="/"+REPO+"/";}else{var i=p.lastIndexOf("/");if(i>=0)base=p.slice(0,i+1)||"./";}document.write('<base href="'+base+'">');window.__SITE_BASE__=base;})();
</script>
<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>菜譜｜今晚食乜餸</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="wrap" id="main">
    <p data-i18n="loading">載入中…</p>
  </main>
  <div id="site-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
  <script>
    (async () => {
      const id = RecipeApp.qs("id");
      const main = document.getElementById("main");
      if (!id) { main.innerHTML = "<p>" + RecipeApp.escapeHtml(RecipeApp.t("missingId")) + "</p>"; return; }
      const data = await RecipeApp.loadJSON("data/recipes.json");
      const r = data.recipes.find(x => x.id === id);
      if (!r) { main.innerHTML = "<p>" + RecipeApp.escapeHtml(RecipeApp.t("notFound")) + "</p>"; return; }

      function paint() {
        document.title = RecipeApp.recipeName(r) + "｜" + RecipeApp.t("appName");
        const tags = (r.tags || []).map(tg => `<span class="tag">${RecipeApp.escapeHtml(tg)}</span>`).join("");
        const ings = (r.ingredients || []).map(i => `
          <li class="ing-item">
            <div class="ing-icon"><img src="assets/icons/ingredient.svg" alt="" width="32" height="32"></div>
            <div>
              <div class="ing-name">${RecipeApp.escapeHtml(RecipeApp.ingName(i))}</div>
              <div class="ing-stores">${RecipeApp.renderStores(i.stores, i.costco_note)}</div>
            </div>
          </li>`).join("");

        const stepsArr = RecipeApp.recipeSteps(r);
        const steps = stepsArr.map((s, idx) => {
          let visual = RecipeApp.stepVisual(idx);
          let extraClass = "";
          // Youtiao: show real photo on first step / full figure below
          if (r.step_image && idx === 0) {
            visual = `<div class="step-visual"><img src="${RecipeApp.escapeHtml(r.step_image)}" alt="" loading="lazy"></div>`;
            extraClass = " has-photo";
          }
          return `<div class="step${extraClass}">
            <div class="step-num">${idx + 1}</div>
            ${visual}
            <div><p style="margin:0">${RecipeApp.escapeHtml(s)}</p></div>
          </div>`;
        }).join("");

        let stepImg = "";
        if (r.step_image) {
          stepImg = `<figure class="step-img-wrap">
            <img src="${RecipeApp.escapeHtml(r.step_image)}" alt="${RecipeApp.escapeHtml(RecipeApp.recipeName(r))}" loading="lazy">
            <figcaption>${RecipeApp.escapeHtml(RecipeApp.t("stepImgCap"))}${RecipeApp.escapeHtml(r.step_image_credit || "")}${RecipeApp.escapeHtml(RecipeApp.t("stepImgNote"))}</figcaption>
          </figure>`;
        }

        const sectionLabel = r.section === "hk" ? RecipeApp.t("navHk") : r.section === "nz" ? RecipeApp.t("navNz") : RecipeApp.t("nzCrossover");
        const back = r.section === "nz" || r.section === "crossover" ? "nz.html" : "hk.html";

        main.innerHTML = `
          <p style="margin:0 0 8px"><a href="${back}">${RecipeApp.escapeHtml(RecipeApp.t("backList"))}</a></p>
          <section class="hero" style="grid-template-columns:auto 1fr;align-items:center">
            <div class="card-visual" style="width:110px;height:110px;border-radius:16px">
              <img src="${RecipeApp.iconPath(r.hero_icon)}" alt="" width="72" height="72">
            </div>
            <div>
              <div class="badge-row" style="margin-bottom:8px">
                <span class="badge warn">${RecipeApp.escapeHtml(RecipeApp.t("badgeDraft"))}</span>
                <span class="badge">${RecipeApp.escapeHtml(sectionLabel)}</span>
                <span class="badge">${RecipeApp.escapeHtml(r.category || "")}</span>
              </div>
              <h1 style="margin:0 0 4px">${RecipeApp.escapeHtml(RecipeApp.recipeName(r))}</h1>
              <p style="margin:0;color:var(--muted)">${RecipeApp.escapeHtml(RecipeApp.recipeSub(r))}</p>
            </div>
          </section>

          <div class="meta-bar">
            <span>🍽 ${RecipeApp.escapeHtml(r.servings || "")}</span>
            <span>⏱ ${RecipeApp.escapeHtml(RecipeApp.t("prep"))}${RecipeApp.escapeHtml(r.time_prep || "—")}</span>
            <span>🔥 ${RecipeApp.escapeHtml(RecipeApp.t("cook"))}${RecipeApp.escapeHtml(r.time_cook || "—")}</span>
          </div>
          <div class="card-tags" style="margin-bottom:12px">${tags}</div>
          <p>${RecipeApp.escapeHtml(RecipeApp.recipeIntro(r))}</p>

          <div class="panel">
            <h2>${RecipeApp.escapeHtml(RecipeApp.t("ingredients"))}</h2>
            <ul class="ing-list">${ings}</ul>
            ${r.nz_note ? `<p class="card-meta" style="margin-top:12px">${RecipeApp.escapeHtml(RecipeApp.t("nzBuy"))}${RecipeApp.escapeHtml(r.nz_note)}</p>` : ""}
          </div>

          <div class="panel">
            <h2>${RecipeApp.escapeHtml(RecipeApp.t("steps"))}</h2>
            <div class="steps">${steps}</div>
            ${stepImg}
          </div>

          ${r.bento_note ? `<div class="callout bento"><strong>${RecipeApp.escapeHtml(RecipeApp.t("bento"))}</strong>${RecipeApp.escapeHtml(r.bento_note)}</div>` : ""}
          ${r.safety ? `<div class="callout safety"><strong>${RecipeApp.escapeHtml(RecipeApp.t("safety"))}</strong>${RecipeApp.escapeHtml(r.safety)}</div>` : ""}
          ${r.hk_tweak ? `<div class="callout"><strong>${RecipeApp.escapeHtml(RecipeApp.t("hkTweak"))}</strong>${RecipeApp.escapeHtml(r.hk_tweak)}</div>` : ""}

          <div class="callout warn" style="background:#fff3cd;border-left-color:var(--warn)">
            ${RecipeApp.escapeHtml(r.draft_disclaimer || data.disclaimer)}
          </div>
        `;
      }
      paint();
      RecipeApp.onLangChange = paint;
    })().catch(e => { document.getElementById("main").textContent = e.message; });
  </script>
</body>
</html>
