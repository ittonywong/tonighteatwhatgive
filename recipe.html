<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>
/* GitHub Pages project base — 改 repo 名必須改 REPO */
(function(){var REPO="tonighteatwhatgive";var p=location.pathname;var base="./";if(p==="/"+REPO||p.indexOf("/"+REPO+"/")===0){base="/"+REPO+"/";}else{var i=p.lastIndexOf("/");if(i>=0)base=p.slice(0,i+1)||"./";}document.write('<base href="'+base+'">');window.__SITE_BASE__=base;})();

</script>
<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>菜譜｜太太菜譜站</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="wrap" id="main">
    <p>載入中…</p>
  </main>
  <div id="site-footer"></div>
  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
  <script>
    (async () => {
      const id = RecipeApp.qs("id");
      const main = document.getElementById("main");
      if (!id) { main.innerHTML = "<p>缺少菜譜 id。</p>"; return; }
      const data = await RecipeApp.loadJSON("data/recipes.json");
      const r = data.recipes.find(x => x.id === id);
      if (!r) { main.innerHTML = "<p>搵唔到呢款菜譜。</p>"; return; }
      document.title = r.name_zh + "｜太太菜譜站";

      const tags = (r.tags || []).map(t => `<span class="tag">${RecipeApp.escapeHtml(t)}</span>`).join("");
      const ings = (r.ingredients || []).map(i => `
        <li class="ing-item">
          <div class="ing-icon"><img src="assets/icons/ingredient.svg" alt="" width="32" height="32"></div>
          <div>
            <div class="ing-name">${RecipeApp.escapeHtml(i.name)}</div>
            <div class="ing-stores">${RecipeApp.renderStores(i.stores, i.costco_note)}</div>
          </div>
        </li>`).join("");

      const steps = (r.steps || []).map((s, idx) => `
        <div class="step">
          <div class="step-num">${idx + 1}</div>
          <div><p style="margin:0">${RecipeApp.escapeHtml(s)}</p></div>
        </div>`).join("");

      let stepImg = "";
      if (r.step_image) {
        stepImg = `<figure class="step-img-wrap">
          <img src="${RecipeApp.escapeHtml(r.step_image)}" alt="步驟參考圖：${RecipeApp.escapeHtml(r.name_zh)}" loading="lazy">
          <figcaption>步驟參考圖｜${RecipeApp.escapeHtml(r.step_image_credit || "資料來源")}（僅供版式／流程示意；正文步驟已另行書面語重寫）</figcaption>
        </figure>`;
      }

      const sectionLabel = r.section === "hk" ? "港式主庫" : r.section === "nz" ? "NZ 西餐" : "港式×NZ";
      const back = r.section === "nz" || r.section === "crossover" ? "nz.html" : "hk.html";

      main.innerHTML = `
        <p style="margin:0 0 8px"><a href="${back}">← 返回列表</a></p>
        <section class="hero" style="grid-template-columns:auto 1fr;align-items:center">
          <div class="card-visual" style="width:110px;height:110px;border-radius:16px">
            <img src="${RecipeApp.iconPath(r.hero_icon)}" alt="" width="72" height="72">
          </div>
          <div>
            <div class="badge-row" style="margin-bottom:8px">
              <span class="badge warn">草稿・未驗證・未試煮</span>
              <span class="badge">${RecipeApp.escapeHtml(sectionLabel)}</span>
              <span class="badge">${RecipeApp.escapeHtml(r.category || "")}</span>
            </div>
            <h1 style="margin:0 0 4px">${RecipeApp.escapeHtml(r.name_zh)}</h1>
            <p style="margin:0;color:var(--muted)">${RecipeApp.escapeHtml(r.name_en || "")}</p>
          </div>
        </section>

        <div class="meta-bar">
          <span>🍽 ${RecipeApp.escapeHtml(r.servings || "")}</span>
          <span>⏱ 準備 ${RecipeApp.escapeHtml(r.time_prep || "—")}</span>
          <span>🔥 煮 ${RecipeApp.escapeHtml(r.time_cook || "—")}</span>
        </div>
        <div class="card-tags" style="margin-bottom:12px">${tags}</div>
        <p>${RecipeApp.escapeHtml(r.intro || "")}</p>

        <div class="panel">
          <h2>材料（附 NZ 超市來源）</h2>
          <ul class="ing-list">${ings}</ul>
          ${r.nz_note ? `<p class="card-meta" style="margin-top:12px">NZ 買料總評：${RecipeApp.escapeHtml(r.nz_note)}</p>` : ""}
        </div>

        <div class="panel">
          <h2>做法步驟</h2>
          <div class="steps">${steps}</div>
          ${stepImg}
        </div>

        ${r.bento_note ? `<div class="callout bento"><strong>便當延伸：</strong>${RecipeApp.escapeHtml(r.bento_note)}</div>` : ""}
        ${r.safety ? `<div class="callout safety"><strong>安全：</strong>${RecipeApp.escapeHtml(r.safety)}</div>` : ""}
        ${r.hk_tweak ? `<div class="callout"><strong>港式小改（可選）：</strong>${RecipeApp.escapeHtml(r.hk_tweak)}</div>` : ""}

        <div class="callout warn" style="background:#fff3cd;border-left-color:var(--warn)">
          ${RecipeApp.escapeHtml(r.draft_disclaimer || data.disclaimer)}
        </div>
      `;
    })().catch(e => { document.getElementById("main").textContent = e.message; });
  </script>
</body>
</html>
