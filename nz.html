<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>
/* GitHub Pages project base — 改 repo 名必須改 REPO */
(function(){var REPO="tonighteatwhatgive";var p=location.pathname;var base="./";if(p==="/"+REPO||p.indexOf("/"+REPO+"/")===0){base="/"+REPO+"/";}else{var i=p.lastIndexOf("/");if(i>=0)base=p.slice(0,i+1)||"./";}document.write('<base href="'+base+'">');window.__SITE_BASE__=base;})();
</script>
<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NZ 西餐／快手｜今晚食乜餸</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="wrap">
    <section class="hero">
      <h1 data-i18n="nzTitle">NZ 西餐／快手</h1>
      <p data-i18n="nzLead">牛扒、羊扒、意粉、BBQ、沙律、早餐。可選港式小改。下列亦含港式×NZ 交叉菜。</p>
    </section>
    <div class="filters" id="filters"></div>
    <div class="grid" id="list"></div>
    <div class="section-title"><h2 data-i18n="nzCrossover">港式口味 × NZ 材料</h2></div>
    <div class="grid" id="xo"></div>
  </main>
  <div id="site-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
  <script>
    (async () => {
      const data = await RecipeApp.loadJSON("data/recipes.json");
      const list = data.recipes.filter(r => r.section === "nz");
      const xo = data.recipes.filter(r => r.section === "crossover");
      let current = "__all__";
      const filters = document.getElementById("filters");
      const grid = document.getElementById("list");
      function cats() {
        return [RecipeApp.t("filterAll"), RecipeApp.t("filterQuick"), ...Array.from(new Set(list.map(r => r.category)))];
      }
      function render(cat) {
        current = cat;
        const allLabel = RecipeApp.t("filterAll");
        const quickLabel = RecipeApp.t("filterQuick");
        filters.innerHTML = cats().map(c =>
          `<button type="button" class="${c===cat?"active":""}" data-cat="${RecipeApp.escapeHtml(c)}">${RecipeApp.escapeHtml(c)}</button>`
        ).join("");
        let rows = list;
        if (cat === quickLabel) rows = list.filter(r => (r.tags||[]).some(t => /快手|Quick|quick|BBQ/i.test(t)));
        else if (cat !== allLabel) rows = list.filter(r => r.category === cat);
        grid.innerHTML = rows.length ? rows.map(RecipeApp.recipeCard).join("") : `<p>${RecipeApp.escapeHtml(RecipeApp.t("emptyList"))}</p>`;
        filters.querySelectorAll("button").forEach(b => b.addEventListener("click", () => render(b.dataset.cat)));
        document.getElementById("xo").innerHTML = xo.map(RecipeApp.recipeCard).join("");
      }
      function paint(){ render(RecipeApp.t("filterAll")); }
      paint();
      RecipeApp.onLangChange = paint;
    })().catch(e => { document.getElementById("list").textContent = e.message; });
  </script>
</body>
</html>
