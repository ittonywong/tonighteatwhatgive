  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
  <script>
    (async () => {
      const [data, week] = await Promise.all([
        RecipeApp.loadJSON("data/recipes.json"),
        RecipeApp.loadJSON("data/week.json"),
      ]);
      const byId = Object.fromEntries(data.recipes.map(r => [r.id, r]));
      function paint() {
        const weekEl = document.getElementById("week-preview");
        weekEl.innerHTML = week.days.slice(0, 3).map(d => {
          const links = (d.recipe_ids || []).map(id => {
            const r = byId[id];
            return r ? `<a href="recipe.html?id=${encodeURIComponent(id)}">${RecipeApp.escapeHtml(RecipeApp.recipeName(r))}</a>` : "";
          }).filter(Boolean).join(" · ");
          const wd = RecipeApp.isZh() ? d.weekday_zh : (d.weekday_en || d.weekday_zh);
          const dinner = RecipeApp.isZh() ? d.dinner : (d.dinner_en || d.dinner);
          return `<article class="day-card">
            <h3><span class="day-num">${d.day}</span>${RecipeApp.escapeHtml(wd)}</h3>
            <div class="dinner">${RecipeApp.escapeHtml(dinner)}</div>
            <div class="card-meta">${RecipeApp.escapeHtml(d.time || "")}</div>
            <p style="margin:8px 0 0;font-size:.9rem">${links}</p>
            <p style="margin:8px 0 0"><a href="week.html#day-${d.day}">${RecipeApp.escapeHtml(RecipeApp.t("dayDetail"))}</a></p>
          </article>`;
        }).join("");
        const featuredIds = ["hk-tomato-egg-rice","hk-salted-fish-pork-rice","hk-youtiao","nz-steak","nz-shepherds-pie","xo-honey-wings","hk-cart-noodle","xo-sweet-sour-pork"];
        document.getElementById("featured").innerHTML = featuredIds
          .map(id => byId[id]).filter(Boolean).map(RecipeApp.recipeCard).join("");
      }
      paint();
      RecipeApp.onLangChange = paint;
    })().catch(e => { document.getElementById("featured").textContent = e.message; });
  </script>
</body>
</html>
